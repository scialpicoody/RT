[package]
name = "rt-gui"
description = "RT GUI: window, painting, widgets (basic only)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rt-core.workspace = true
rt-app.workspace = true
winit = "0.30"
softbuffer = "0.4"
vello_cpu = "0.3"
parley = "0.12"
taffy = "0.15"

[features]
# Forwards rt-core's by-name path to this crate's examples/tests.
dynamic-invoke = ["rt-core/dynamic-invoke"]
